name: app

on:
  push:
    paths:
      - "FreeTV/**"
      - "Packages/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "FreeTV/**"
      - "Packages/**"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run FreeTVCore tests
        run: swift test --package-path Packages/FreeTVCore

  tvos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and UI-test tvOS app
        run: >
          xcodebuild
          -project FreeTV/FreeTV.xcodeproj
          -scheme FreeTV
          -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'
          test CODE_SIGNING_ALLOWED=NO
