name: curate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache translation models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-models-${{ hashFiles('curator/requirements.txt') }}

      - name: Install dependencies
        run: python3 -m pip install -r curator/requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Run curator
        run: python3 -m curator.cli --state state/state.json --out output

      - name: Persist curator state
        run: |
          git config user.name "free-tv-bot"
          git config user.email "free-tv-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update curator state"
          git pull --rebase origin main
          git push

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
